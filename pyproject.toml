[project]
name = "sequax"
version = "0.1.0"
description = "JAX environments for terminal-reward sequence generation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flax>=0.11",
    "jax>=0.6",
    "numpy>=2",
    "optax>=0.2",
    "orbax-checkpoint>=0.11",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sequax"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "W"]
